[package]
name = "greedytile"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors = ["David Gathercole"]
description = "Random greedy pixel pattern generation algorithm"
homepage = "https://github.com/GeEom/greedytile"
repository = "https://github.com/GeEom/greedytile"
documentation = "https://docs.rs/greedytile"
license = "MIT"
readme = "README.md"
keywords = ["tiles", "pattern", "generation"]
categories = ["algorithms", "graphics"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bitvec = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
indicatif = "0.18"
ndarray = "0.16"
num-traits = "0.2"
rand = "0.9"

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "full_generation"
harness = false

[[bench]]
name = "selection"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
debug = true

[profile.bench]
opt-level = 3
lto = "fat"
debug = false

[lints]
workspace = true

[workspace]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
# groups — priority -1, or clippy's lint_groups_priority fails an allow below
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible     = { level = "deny", priority = -1 }
nonstandard_style       = { level = "deny", priority = -1 }
rust_2018_idioms        = { level = "deny", priority = -1 }
unused                  = { level = "deny", priority = -1 }
missing_docs            = "deny"
unsafe_code             = "deny"
unsafe_op_in_unsafe_fn  = "deny"

[workspace.lints.clippy]
# groups — priority -1 so specific lines can override
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
nursery     = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }
# individual denies
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
used_underscore_binding         = "deny"
if_then_some_else_none          = "deny"
missing_const_for_fn            = "deny"
missing_errors_doc              = "deny"
missing_panics_doc              = "deny"
indexing_slicing                = "deny"
result_large_err                = "deny"
shadow_unrelated                = "deny"
wildcard_imports                = "deny"
map_err_ignore                  = "deny"
enum_glob_use                   = "deny"
infinite_loop                   = "deny"
unimplemented                   = "deny"
expect_used                     = "deny"
unwrap_used                     = "deny"
empty_loop                      = "deny"
mem_forget                      = "deny"
dbg_macro                       = "deny"
panic                           = "deny"
todo                            = "deny"
exit                            = "deny"
unreachable                     = "deny"
let_underscore_must_use         = "deny"
let_underscore_untyped          = "deny"
print_stdout                    = "deny"
print_stderr                    = "deny"
unused_result_ok                = "deny"
undocumented_unsafe_blocks      = "deny"
multiple_unsafe_ops_per_block   = "deny"
iter_over_hash_type             = "deny"
# the only permitted allows
module_name_repetitions = "allow"
similar_names           = "allow"
redundant_pub_crate     = "allow"
multiple_crate_versions = "allow"
